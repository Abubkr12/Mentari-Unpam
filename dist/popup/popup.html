<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentari Mod Modern Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 280px;
      background: #141418;
      color: #f0f0f0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }
    .header-logo {
      width: 28px;
      height: 28px;
    }
    .header-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .header-badge {
      font-size: 10px;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: auto;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-label { color: #888; }
    .status-val { font-weight: 600; color: #10b981; }
    .status-val.warning { color: #f59e0b; }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      background: #d4af37;
      color: #121212;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #e6be40;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #ddd;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #666;
      padding-top: 4px;
    }
    .msg-feedback {
      font-size: 11px;
      color: #f59e0b;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../assets/icon.png" alt="Logo" class="header-logo">
    <div class="header-title">Mentari Mod</div>
    <span class="header-badge">v2.0 Modern</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Koneksi Halaman:</span>
      <span class="status-val" id="page-status">Memeriksa...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Model Gemini:</span>
      <span class="status-val" id="model-status" style="color:#d4af37;">-</span>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" id="btn-toggle-dashboard">Buka Dashboard Mentari</button>
    <button class="btn btn-secondary" id="btn-open-settings">Pengaturan API Key</button>
  </div>

  <div class="msg-feedback" id="feedback-msg"></div>

  <div class="footer">
    Dukungan AI Generasi Baru & Anti-Deteksi
  </div>

  <script src="script.js"></script>
</body>
</html>
