<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentari Mod Modern Edition</title>
  <style>
    :root {
      --bg-body: #141418;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-input: #1e1e24;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(245, 158, 11, 0.3);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #f59e0b;
      --btn-primary-bg: #f59e0b;
      --btn-primary-fg: #0f172a;
      --btn-primary-hover: #fbbf24;
      --btn-sec-bg: rgba(255, 255, 255, 0.06);
      --btn-sec-fg: #e2e8f0;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-body: #f8fafc;
        --bg-card: #ffffff;
        --bg-input: #ffffff;
        --border-subtle: #e2e8f0;
        --border-accent: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --accent-color: #1e3a8a;
        --btn-primary-bg: #1e3a8a;
        --btn-primary-fg: #ffffff;
        --btn-primary-hover: #1e40af;
        --btn-sec-bg: #ffffff;
        --btn-sec-fg: #334155;
      }
    }

    body.theme-light {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --border-subtle: #e2e8f0;
      --border-accent: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-color: #1e3a8a;
      --btn-primary-bg: #1e3a8a;
      --btn-primary-fg: #ffffff;
      --btn-primary-hover: #1e40af;
      --btn-sec-bg: #ffffff;
      --btn-sec-fg: #334155;
    }

    body.theme-dark {
      --bg-body: #141418;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-input: #1e1e24;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(245, 158, 11, 0.3);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #f59e0b;
      --btn-primary-bg: #f59e0b;
      --btn-primary-fg: #0f172a;
      --btn-primary-hover: #fbbf24;
      --btn-sec-bg: rgba(255, 255, 255, 0.06);
      --btn-sec-fg: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 296px;
      background: var(--bg-body);
      color: var(--text-primary);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }
    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .header-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }
    .header-badge {
      font-size: 10px;
      color: var(--accent-color);
      background: rgba(245, 158, 11, 0.14);
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 700;
      margin-left: auto;
    }
    body.theme-light .header-badge {
      background: #dbeafe;
    }
    .status-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-label { color: var(--text-secondary); }
    .status-val { font-weight: 600; color: #059669; }
    .status-val.warning { color: #d97706; }
    .status-val.danger { color: #dc2626; }

    /* Quick API Key Box */
    .quick-api-card {
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quick-api-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quick-api-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .api-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
    }
    .api-badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
    }
    .quick-input-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .quick-input {
      flex: 1;
      min-width: 0;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-primary);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .quick-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.16);
    }
    .btn-quick-save {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-quick-save:hover {
      background: var(--btn-primary-hover);
      transform: translateY(-1px);
    }
    .btn-quick-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .quick-api-hint {
      font-size: 10px;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--btn-primary-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-fg);
      border: 1px solid var(--border-subtle);
    }
    .btn-secondary:hover {
      border-color: var(--accent-color);
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-secondary);
      padding-top: 2px;
    }
    .msg-feedback {
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 6px;
      text-align: center;
      display: none;
      line-height: 1.3;
      transition: all 0.2s;
    }
    .msg-feedback.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #059669;
    }
    .msg-feedback.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #dc2626;
    }
    .msg-feedback.warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #d97706;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../assets/icon.png" alt="Logo" class="header-logo">
    <div class="header-title">Mentari Mod</div>
    <span class="header-badge">v2.1 Modern</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Koneksi Halaman:</span>
      <span class="status-val" id="page-status">Memeriksa...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Model Gemini:</span>
      <span class="status-val" id="model-status" style="color:#d4af37;">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">Status API Key:</span>
      <span class="status-val" id="api-status-label">Memeriksa...</span>
    </div>
  </div>

  <div class="quick-api-card" id="quick-api-section">
    <div class="quick-api-header">
      <span class="quick-api-title">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-1-1l-2 2m-1-1l-2 2M3 21l9-9m0 0l3-3m-3 3l-3-3m3 3l3 3"></path>
        </svg>
        Quick API Key Gemini
      </span>
      <span class="api-badge" id="api-badge">Memeriksa</span>
    </div>
    <div class="quick-input-wrap">
      <input type="password" id="input-quick-api-key" class="quick-input" placeholder="AQ... atau AIza..." spellcheck="false" autocomplete="off">
      <button class="btn-quick-save" id="btn-save-quick-key" type="button" title="Simpan & Validasi Key">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Simpan
      </button>
    </div>
    <div class="quick-api-hint" id="quick-api-hint">Masukkan API Key dari Google AI Studio.</div>
  </div>

  <div class="btn-group">
    <button class="btn" id="btn-toggle-dashboard">Buka Dashboard Mentari</button>
    <button class="btn btn-secondary" id="btn-open-settings">Pengaturan Lengkap API Key</button>
  </div>

  <div class="msg-feedback" id="feedback-msg"></div>

  <div class="footer">
    Dukungan AI Generasi Baru & Anti-Deteksi
  </div>

  <script src="script.js"></script>
</body>
</html>
